<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube Planner</title>
<style>
:root{color-scheme:dark;--bg:#0a0f1a;--p1:#0f1726;--p2:#16233a;--bd:#22304a;--tx:#d9e2f3;--mu:#7f90ae;--ac:#3b82f6;--dg:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}
#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;background:var(--p1);border-bottom:1px solid var(--bd);padding:0 12px;overflow-x:auto}
#nav h1{font-size:13px;margin:0 18px 0 0;letter-spacing:.12em;white-space:nowrap;font-weight:600;color:#8db8ff}
.tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);padding:12px 14px;font:inherit;cursor:pointer;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:var(--ac)}
main{padding:14px;max-width:1600px;margin:auto}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:#0c1424;border:1px solid var(--bd);border-radius:4px;padding:6px 8px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--ac);border-color:var(--ac)}
textarea{resize:vertical;min-height:32px;overflow:hidden}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--ac)}
label{display:flex;gap:6px;align-items:center}
.b{border:1px solid var(--bd);background:var(--p2);color:var(--tx);border-radius:4px;padding:6px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.b:hover{border-color:var(--ac)}.b.p{background:var(--ac);border-color:var(--ac);color:#fff}.b.sm{padding:3px 8px;font-size:12px}.b.d:hover{border-color:var(--dg);color:var(--dg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.mu{color:var(--mu)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.c{background:var(--p1);border:1px solid var(--bd);border-radius:6px;padding:10px 12px}.c span{color:var(--mu);font-size:12px}.c b{display:block;font-size:20px;font-weight:600}
.pr{height:4px;background:var(--bd);margin-top:8px}.pr i{display:block;height:100%;background:var(--ac)}
.ch{background:var(--p1);border:1px solid var(--bd);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.br{display:grid;grid-template-columns:minmax(80px,260px) 1fr 90px;gap:10px;align-items:center;margin:5px 0}
.br .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bt{background:var(--bd);height:10px}.bt i{display:block;height:100%;background:var(--ac)}.br b{text-align:right;font-weight:500}
.wrap{overflow:auto;background:var(--p1);border:1px solid var(--bd);border-radius:6px}
table{border-collapse:collapse;table-layout:fixed}
th,td{border-bottom:1px solid var(--bd);padding:4px;vertical-align:middle;position:relative}
th{font-size:12px;font-weight:500;color:var(--mu);text-align:left;background:var(--p2);padding:8px 6px;white-space:nowrap;position:sticky;top:0;z-index:1}
.rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;touch-action:none}.rz:hover{background:var(--ac);opacity:.5}
td.n{text-align:right;color:var(--mu);padding-right:8px}
.split{display:grid;grid-template-columns:var(--lw) 8px 1fr;height:calc(100dvh - 80px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.lp,.ep{overflow:auto;min-height:0}.lp{padding-right:4px}
#split{cursor:col-resize;touch-action:none;border-left:1px solid var(--bd);margin-left:3px}
.ep{background:var(--p1);border:1px solid var(--bd);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.eh{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--bd);align-items:center;flex-wrap:wrap}
.eb{flex:1;overflow:auto;padding:10px;min-height:0}
.ir{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-left:3px solid var(--bd);background:var(--p1);margin-bottom:6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.ir:hover{border-color:var(--ac)}.ir.sel{border-left-color:var(--ac);background:var(--p2)}.ir .it{flex:1;overflow:hidden;text-overflow:ellipsis}
.badge{border:1px solid var(--ac);color:#8db8ff;font-size:11px;padding:0 8px;border-radius:3px;min-width:56px;text-align:center}
.ln{display:grid;grid-template-columns:28px 110px 1fr auto;gap:6px;align-items:start;margin-bottom:6px}
.ln .no{color:var(--mu);text-align:right;padding-top:7px}.ln .ac{display:flex;gap:4px;flex-wrap:wrap}
.dt{grid-column:3/5;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:4px}
.back{display:none}h3{font-size:13px;margin:20px 0 8px;color:#8db8ff;font-weight:600}input[type=file]{padding:4px 6px}.hero-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))!important}.hero{padding:16px 18px;border-left:3px solid var(--ac)}.hero>span:first-child{font-size:12px;letter-spacing:.08em}.hero b{font-size:clamp(40px,5vw,64px);line-height:1.05;font-weight:700;color:#fff;text-shadow:0 0 22px rgba(59,130,246,.55);letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}.hero b small{font-size:16px;font-weight:500;color:#8db8ff;margin-left:6px;text-shadow:none;letter-spacing:0}.hero.late{border-left-color:var(--dg)}.hero.late b{color:#ff8a8f}.hero .pr{height:6px}.dl{font-size:12px;color:#8db8ff;border:1px solid var(--bd);padding:0 8px;border-radius:3px;white-space:nowrap}.dl.soon{color:#f0b429;border-color:#f0b429}.dl.late{color:var(--dg);border-color:var(--dg)}th[data-a]{cursor:pointer}.fl th{position:static;padding:4px}.fl input,.fl select{padding:3px 5px;font-size:12px}.empty{margin:auto;color:var(--mu);padding:30px;text-align:center}
.item{display:flex;gap:8px;align-items:center;background:var(--p1);border:1px solid var(--bd);border-radius:4px;padding:8px;margin-bottom:6px}
.item.col{flex-direction:column;align-items:stretch}.item.done input[type=text]{text-decoration:line-through;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--p2);border:1px solid var(--ac);padding:8px 14px;border-radius:4px;display:none;gap:12px;align-items:center;z-index:30}
#err{display:none;position:fixed;top:0;left:0;right:0;background:var(--dg);color:#fff;padding:6px 12px;z-index:40}
@media (max-width:900px){.split{grid-template-columns:1fr}.split.has .lp,.split.has #split,.split:not(.has) .ep,.split:not(.has) #split{display:none}.back{display:inline-block}.ln{grid-template-columns:24px 90px 1fr}.ln .ac{grid-column:2/4}.dt{grid-column:1/4}main{padding:8px}}
@media (min-aspect-ratio:7/5) and (max-aspect-ratio:8/5) and (min-width:901px){body{font-size:12.5px}main{padding:8px}}
</style></head><body>
<nav id="nav"><h1>YOUTUBE PLANNER</h1><button class="tab" data-t="an">アナリティクス</button><button class="tab" data-t="id">動画作成案</button><button class="tab" data-t="nt">テンプレ・メモ</button><button class="tab" data-t="st">設定</button></nav>
<main id="app"></main><div id="toast"></div><div id="err"></div>
<script>

const id=n=>sp.find(s=>s.name===n).id,L=(n,text,fx='')=>({id:uid(),sp:id(n),text,note:'',fx,img:'',bgm:'',open:false});

videos:[['紹介','『ミニマリストになりたい！』弱小会社員の部屋紹介【ゆっくり】'],['思想','『中二病でも恋がしたい！』末期患者の症状とリアルな妄想紹介【VOICEVOX】'],['紹介','『百合を語ろう！』おすすめ作品&カップリング5選【VOICEVOX】'],['紹介','『海外旅行に行きたい！』おすすめグッズと旅行先での心得【VOICEBOX】'],['Vlog','『スシ食いねェ!』寿司ガキを読んで寿司を喰らう【VOICEBOX】']].map(([type,title])=>({id:uid(),title,type,date:'',url:'',views:0,likes:0,mins:0,rev:0,monet:false})),
ideas:[{id:uid(),title:'夏を取り戻せ！1人でもできる僕らの大人夏休み！',type:'Vlog',arch:false,date:'',kosei:'',gaiyo:'',lines:[L('効果','--セミの鳴き声--'),L('魔理沙','、、、暑い、暑すぎる。'),L('霊夢','どうしたの魔理沙。'),L('魔理沙','最近の夏暑すぎやしないか、？','ツッコミ')]},{id:uid(),title:'『深夜の高速道路ってわくわくする！』真夜中シリーズ #1',type:'紹介',arch:false,date:'',kosei:'',gaiyo:'',lines:[]}],
todos:[{id:uid(),t:'次回動画の台本を書く',done:false},{id:uid(),t:'サムネイルを作る',done:false}],
notes:{d:[{id:uid(),t:'基本テンプレ',b:'今回は〇〇を紹介します。\n\n▼目次\n0:00 オープニング\n\n▼使用素材\nVOICEVOX:ずんだもん'}],x:[{id:uid(),t:'真夜中ネタ',b:'『真夜中のドン・キホーテってテーマパークだよね！』'}],m:[{id:uid(),t:'メモ',b:''}]}}}
try{S=JSON.parse(localStorage.getItem('ytp3'))}catch(e){}
if(!S||!S.ideas)S=seed();
const persist=()=>{try{localStorage.setItem('ytp3',JSON.stringify(S))}catch(e){}};
const H={u:[],r:[],last:null,g:null,t:0};
function hist(g){const cur=JSON.stringify(S.ideas);if(H.last===null){H.last=cur;return}if(cur===H.last)return;const n=Date.now();if(!(g&&H.g===g&&n-H.t<800)){H.u.push(H.last);if(H.u.length>100)H.u.shift()}H.r=[];H.g=g||null;H.t=n;H.last=cur}
const save=g=>{persist();hist(g)};
const spOf=id=>S.sp.find(s=>s.id===id)||{name:'(未設定)',fx:false};
const list=c=>c==='lines'||c==='itodos'?(S.ideas.find(x=>x.id===UI.sel)||{lines:[],todos:[]})[c==='lines'?'lines':'todos']:c==='notes'?S.notes[UI.nt]:S[c];
const grow=t=>{t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'};
const mvb=(c,id)=>`<button class="b sm" data-a="up" data-c="${c}" data-id="${id}">上へ</button><button class="b sm" data-a="dn" data-c="${c}" data-id="${id}">下へ</button><button class="b sm d" data-a="del" data-c="${c}" data-id="${id}">削除</button>`;
function vid(u){u=String(u||'').trim();const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|video\/)([\w-]{11})/)||u.match(/^([\w-]{11})$/);return m?m[1]:''}
function cw(k,d){if(!S.w[k]||S.w[k].length!==d.length)S.w[k]=d.slice()}
const cols=k=>`<colgroup>${S.w[k].map(x=>`<col style="width:${x}px">`).join('')}</colgroup>`,tw=k=>S.w[k].reduce((a,b)=>a+b,0);
/* ---------- アナリティクス ---------- */
function mig(){if(!S.types){S.types=TYPES.map(name=>({id:uid(),name}));const m=n=>(S.types.find(t=>t.name===n)||S.types[S.types.length-1]).id;S.videos.forEach(v=>v.type=m(v.type));S.ideas.forEach(i=>i.type=m(i.type))}
S.ideas.forEach(i=>{i.todos=i.todos||[]});S.viewGoal=S.viewGoal||0;if(S.monthGoal===undefined)S.monthGoal=4;S.chId=S.chId||'';S.w=S.w||{};
S.videos.forEach(v=>{if(v.dur===undefined)v.dur='';if(v.err===undefined)v.err='';if(v.src===undefined)v.src=(nv(v.views)||nv(v.likes))?'old':'';if(v.mins===0)v.mins='';if(v.rev===0)v.rev=''})}
mig();H.last=JSON.stringify(S.ideas);
const tn=id=>(S.types.find(t=>t.id===id)||{name:'(未設定)'}).name;
const topts=cur=>(S.types.some(t=>t.id===cur)?'':`<option value="${esc(cur)}" selected>(未設定)</option>`)+S.types.map(t=>`<option value="${t.id}"${t.id===cur?' selected':''}>${esc(t.name)}</option>`).join('');
const nvid=o=>Object.assign({id:uid(),title:'',type:(S.types[0]||{}).id||'',date:'',url:'',views:'',likes:'',dur:'',mins:'',rev:'',monet:false,src:'',err:''},o||{});
const has=v=>!!v.src,vv=(v,k)=>has(v)&&v[k]!==''&&v[k]!==undefined?fmt(v[k]):'-';
const rate=v=>has(v)&&nv(v.views)&&v.likes!==''?(nv(v.likes)/nv(v.views)*100).toFixed(1)+'%':'-',rpm=v=>has(v)&&nv(v.views)&&nv(v.rev)?fmt(nv(v.rev)/nv(v.views)*1000)+'円':'-';

const SKEY={'題名':'title','投稿日':'date','投稿間隔':'gap','再生回数':'views','いいね':'likes'};
function gapMap(){const d=S.videos.filter(v=>v.date).sort((a,b)=>a.date>b.date?1:a.date<b.date?-1:0),m={};d.forEach((v,i)=>{m[v.id]=i?Math.round((new Date(v.date)-new Date(d[i-1].date))/864e5):null});return m}
function vlist(){const f=UI.f,k=UI.sk,G=gapMap(),sv=v=>k==='gap'?(G[v.id]??null):k==='views'||k==='likes'?(has(v)&&v[k]!==''?nv(v[k]):null):k==='title'?(v.title||''):((v[k]||'')||null);
return S.videos.filter(v=>(!f.t||(v.title||'').toLowerCase().includes(f.t.toLowerCase()))&&(!f.ty||v.type===f.ty)&&(!f.d1||(v.date&&v.date>=f.d1))&&(!f.d2||(v.date&&v.date<=f.d2))&&(!f.v||(has(v)&&nv(v.views)>=nv(f.v)))&&(!f.l||(has(v)&&nv(v.likes)>=nv(f.l)))).sort((a,b)=>{const x=sv(a),y=sv(b);if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return -1;return(typeof x==='string'?x.localeCompare(y,'ja'):x-y)*UI.sd})}
const rowsH=()=>{const G=gapMap();return vlist().map((v,n)=>`<tr><td class="n">${n+1}</td><td><input data-b="videos|${v.id}|title" value="${esc(v.title)}" placeholder="題名"></td><td><select data-b="videos|${v.id}|type">${topts(v.type)}</select></td><td><input type="date" data-b="videos|${v.id}|date" value="${esc(v.date)}"></td><td>${G[v.id]==null?'-':G[v.id]+'日'}</td><td><input data-b="videos|${v.id}|url" value="${esc(v.url)}" placeholder="URL または動画ID">${vid(v.url)?`<a class="mu" target="_blank" rel="noopener" href="https://studio.youtube.com/video/${vid(v.url)}/analytics">Studioで開く</a>`:''}${v.err?`<div style="color:var(--dg);font-size:12px">${esc(v.err)}</div>`:''}</td><td title="APIで取得できた場合のみ表示">${vv(v,'views')}</td><td>${vv(v,'likes')}</td><td><input data-b="videos|${v.id}|dur" value="${esc(v.dur)}" placeholder="12:34"></td><td data-rate="${v.id}">${rate(v)}</td><td><button class="b sm" data-a="fone" data-id="${v.id}">取得</button> <button class="b sm" data-a="clr" data-id="${v.id}">数値クリア</button> <button class="b sm d" data-a="del" data-c="videos" data-id="${v.id}">削除</button></td></tr>`).join('')||'<tr><td colspan="11" class="mu" style="padding:14px">該当する動画がありません</td></tr>'};
function sumH(){const L=vlist(),a=L.filter(has),G=gapMap(),g=L.map(v=>G[v.id]).filter(x=>x!=null);return`表示 ${L.length} / ${S.videos.length} 件 ${g.length?`・ 平均投稿間隔 ${Math.round(g.reduce((x,y)=>x+y,0)/g.length)}日 `:''}・ 再生回数合計 ${fmt(a.reduce((s,v)=>s+nv(v.views),0))} ・ いいね合計 ${fmt(a.reduce((s,v)=>s+nv(v.likes),0))}`}
const refreshSum=()=>{const s=$('#asum');if(s)s.textContent=sumH()},refreshRows=()=>{const b=$('#tb');if(b)b.innerHTML=rowsH();refreshSum()};
function heroH(){const T=new Date(),ym=T.getFullYear()+'-'+String(T.getMonth()+1).padStart(2,'0'),mc=S.videos.filter(v=>(v.date||'').startsWith(ym)).length,mg=nv(S.monthGoal),tv=S.videos.filter(has),views=tv.reduce((a,v)=>a+nv(v.views),0),
ni=S.ideas.filter(i=>!i.arch&&i.date).map(i=>[i,dleft(i.date)]).sort((a,b)=>(a[1]<0)-(b[1]<0)||a[1]-b[1])[0],
K=(l,big,unit,sub,p,cls='')=>`<div class="c hero ${cls}"><span>${l}</span><b>${big}<small>${unit}</small></b>${p===null?'':bar(p)}<span>${sub}</span></div>`;
const n=ni?ni[1]:null;
return`<div class="cards hero-grid">${K('登録者数',fmt(S.subs),'人',`目標 ${fmt(S.goal)}(${pc(S.subs,S.goal)}%)`,pc(S.subs,S.goal))}${K('全体の総再生回数',fmt(views),'回',`取得済み ${tv.length} / ${S.videos.length} 本`,null)}${K((T.getMonth()+1)+'月の投稿本数',mc,'本',mg?`目標 ${mg}本(${pc(mc,mg)}%)`:'目標未設定(設定タブで入力)',mg?pc(mc,mg):null)}${ni?K('次の動画まで',n===0?'本日':Math.abs(n),n===0?'':n>0?'日':'日超過',`${esc(ni[0].title||'(無題)')}(${ni[0].date})`,null,n<0?'late':''):K('次の動画まで','-','','投稿予定日が未設定です(動画作成案で設定)',null)}</div>`}
function vAn(){cw('an',[34,260,90,130,80,160,90,80,80,80,190]);const f=UI.f,H=['No','題名','種別','投稿日','投稿間隔','動画URL / ID','再生回数','いいね','動画の長さ','高評価率','操作'];
return`<div class="row"><input id="lnk" placeholder="動画のリンク(URL)を貼り付けて Enter" style="flex:1;min-width:240px"><button class="b p" data-a="addlink">リンクから追加して取得</button><button class="b" data-a="fetch">全動画を再取得</button><button class="b" data-a="addv">空の行を追加</button></div>
<div class="row"><span id="st" class="mu">${esc(UI.st)}</span>${S.key?'':'<span style="color:var(--dg)">APIキーが未設定です。設定タブで入力してください</span>'}</div>

<div class="row mu" id="asum">${sumH()}</div><div class="wrap"><table style="width:${tw('an')}px">${cols('an')}<thead><tr>${H.map((h,i)=>`<th${SKEY[h]?` data-a="sort" data-v="${SKEY[h]}"`:''}>${h}${SKEY[h]&&UI.sk===SKEY[h]?(UI.sd>0?' ↑':' ↓'):''}<i class="rz" data-k="an" data-i="${i}"></i></th>`).join('')}</tr><tr class="fl"><th></th><th><input data-f="t" placeholder="題名で絞り込み" value="${esc(f.t)}"></th><th><select data-f="ty"><option value="">すべて</option>${S.types.map(t=>`<option value="${t.id}"${f.ty===t.id?' selected':''}>${esc(t.name)}</option>`).join('')}</select></th><th><input type="date" data-f="d1" title="開始日" value="${f.d1}"><input type="date" data-f="d2" title="終了日" value="${f.d2}"></th><th></th><th></th><th><input type="number" min="0" data-f="v" placeholder="以上" value="${esc(f.v)}"></th><th><input type="number" min="0" data-f="l" placeholder="以上" value="${esc(f.l)}"></th><th></th><th></th><th><button class="b sm" data-a="fclr">フィルター解除</button></th></tr></thead><tbody id="tb">${rowsH()}</tbody></table></div>`}
